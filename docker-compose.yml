services:

  # =========================================================
  # REDIS
  # =========================================================
  cache:
    image: redis:4-alpine
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # MYSQL
  # Fleetbase deploy.sh ek veritabanları oluşturduğu için
  # API root kullanıcısı ile bağlanır.
  # =========================================================
  database:
    image: mysql:8.0-oracle
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: fleetbase

    volumes:
      - "./docker/database/:/docker-entrypoint-initdb.d/:ro"
      - fleetbase_db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s


  # =========================================================
  # SOCKETCLUSTER
  #
  # Dokploy:
  # tms-socket.1vs.co -> socket -> port 8000
  # =========================================================
  socket:
    image: socketcluster/socketcluster:v17.4.0
    platform: linux/amd64
    restart: unless-stopped

    expose:
      - "8000"

    environment:
      SOCKETCLUSTER_WORKERS: 10
      SOCKETCLUSTER_BROKERS: 10
      SOCKETCLUSTER_OPTIONS: '{"origins":"https://${CONSOLE_DOMAIN}:*"}'


  # =========================================================
  # SCHEDULER
  # =========================================================
  scheduler:
    image: fleetbase/fleetbase-api:latest
    restart: unless-stopped

    command:
      - go-crond
      - --verbose
      - root:./crontab

    environment:
      APP_KEY: ${APP_KEY}
      APP_NAME: ${APP_NAME}

      APP_ENV: production
      ENVIRONMENT: production
      APP_DEBUG: "false"

      DATABASE_URL: "mysql://root:${DB_ROOT_PASSWORD}@database/fleetbase"

      QUEUE_CONNECTION: redis

      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache

      REDIS_URL: tcp://cache

    depends_on:
      database:
        condition: service_healthy

      cache:
        condition: service_healthy


  # =========================================================
  # QUEUE WORKER
  # =========================================================
  queue:
    image: fleetbase/fleetbase-api:latest
    restart: unless-stopped

    command:
      - php
      - artisan
      - queue:work
      - --tries=3
      - --timeout=90

    environment:
      APP_KEY: ${APP_KEY}
      APP_NAME: ${APP_NAME}

      APP_ENV: production
      ENVIRONMENT: production
      APP_DEBUG: "false"

      DATABASE_URL: "mysql://root:${DB_ROOT_PASSWORD}@database/fleetbase"

      QUEUE_CONNECTION: redis

      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache

      REDIS_URL: tcp://cache

    depends_on:
      database:
        condition: service_healthy

      cache:
        condition: service_healthy


  # =========================================================
  # FLEETBASE APPLICATION / API
  # =========================================================
  application:
    image: fleetbase/fleetbase-api:latest
    restart: unless-stopped

    environment:
      # Laravel / Fleetbase
      APP_KEY: ${APP_KEY}
      APP_NAME: ${APP_NAME}

      APP_ENV: production
      ENVIRONMENT: production
      APP_DEBUG: "false"

      # Public URLs
      APP_URL: "https://${API_DOMAIN}"
      CONSOLE_HOST: "https://${CONSOLE_DOMAIN}"

      # Database
      DATABASE_URL: "mysql://root:${DB_ROOT_PASSWORD}@database/fleetbase"

      # Queue / Redis
      QUEUE_CONNECTION: redis

      CACHE_DRIVER: redis
      CACHE_PATH: /fleetbase/api/storage/framework/cache
      CACHE_URL: tcp://cache

      REDIS_URL: tcp://cache

      # Sessions
      SESSION_DRIVER: redis
      SESSION_DOMAIN: ".${BASE_DOMAIN}"

      # Realtime
      BROADCAST_DRIVER: socketcluster

      # Mail
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      # Logging
      LOG_CHANNEL: daily

      # Fleetbase Registry
      REGISTRY_HOST: https://registry.fleetbase.io
      REGISTRY_PREINSTALLED_EXTENSIONS: "true"

      # Routing
      OSRM_HOST: https://router.project-osrm.org

    volumes:
      - fleetbase_api_storage:/fleetbase/api/storage/app

    depends_on:
      database:
        condition: service_healthy

      cache:
        condition: service_healthy

      queue:
        condition: service_started


  # =========================================================
  # HTTPD / NGINX
  #
  # Dokploy:
  # tms-api.1vs.co -> httpd -> port 80
  # =========================================================
  httpd:
    restart: unless-stopped

    build:
      context: .
      dockerfile: docker/httpd/Dockerfile

    expose:
      - "80"

    depends_on:
      - application


  # =========================================================
  # FLEETBASE CONSOLE
  #
  # Dokploy:
  # tms.1vs.co -> console -> port 4200
  # =========================================================
  console:
    restart: unless-stopped

    build:
      context: ./console
      dockerfile: Dockerfile

      args:
        ENVIRONMENT: production

    expose:
      - "4200"

    volumes:
      - ./console/fleetbase.config.json:/usr/share/nginx/html/fleetbase.config.json:ro


# ===========================================================
# PERSISTENT VOLUMES
# ===========================================================
volumes:
  fleetbase_db_data:
  fleetbase_api_storage:
